<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard · Share Shelf</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-mount"></div>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3>Admin Dashboard</h3>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-6 col-md-2"><div class="card stat-card p-3 shadow-sm"><div class="text-muted small">Total Users</div><div class="fs-4 fw-bold">50</div></div></div>
    <div class="col-6 col-md-2"><div class="card stat-card p-3 shadow-sm"><div class="text-muted small">Pending Listings</div><div class="fs-4 fw-bold text-warning">3</div></div></div>
    <div class="col-6 col-md-2"><div class="card stat-card p-3 shadow-sm"><div class="text-muted small">Live Listings</div><div class="fs-4 fw-bold text-success">57</div></div></div>
    <div class="col-6 col-md-2"><div class="card stat-card p-3 shadow-sm"><div class="text-muted small">Open Reports</div><div class="fs-4 fw-bold text-danger">2</div></div></div>
    <div class="col-6 col-md-2"><div class="card stat-card p-3 shadow-sm"><div class="text-muted small">Open Tickets</div><div class="fs-4 fw-bold text-info">1</div></div></div>
    <div class="col-6 col-md-2"><div class="card stat-card p-3 shadow-sm"><div class="text-muted small">Banned Users</div><div class="fs-4 fw-bold text-secondary">0</div></div></div>
  </div>

  <div class="row g-3">
    <div class="col-md-3">
      <a href="admin-listings.html" class="card text-decoration-none text-dark shadow-sm p-4 h-100">
        <h5>📦 Manage Listings</h5><p class="small text-muted mb-0">Approve or reject pending items</p>
      </a>
    </div>
    <div class="col-md-3">
      <a href="admin-users.html" class="card text-decoration-none text-dark shadow-sm p-4 h-100">
        <h5>👤 Manage Users</h5><p class="small text-muted mb-0">View profiles, history, ban users</p>
      </a>
    </div>
    <div class="col-md-3">
      <a href="admin-reports.html" class="card text-decoration-none text-dark shadow-sm p-4 h-100">
        <h5>🚩 Reports</h5><p class="small text-muted mb-0">Review reported listings</p>
      </a>
    </div>
    <div class="col-md-3">
      <a href="admin-tickets.html" class="card text-decoration-none text-dark shadow-sm p-4 h-100">
        <h5>🎫 Support Tickets</h5><p class="small text-muted mb-0">Respond to user tickets</p>
      </a>
    </div>
  </div>
</div>

<div id="footer-mount"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>requireDemoAdmin();</script>
</body>
</html>
