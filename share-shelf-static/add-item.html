<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>List an Item · Share Shelf</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-mount"></div>

<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h3 class="mb-3">List an Item</h3>
          <p class="text-muted small">Demo only — this adds the listing to "My Listings" in your browser, nothing is saved anywhere else.</p>

          <form id="listingForm">
            <div class="mb-3">
              <label class="form-label">Title *</label>
              <input type="text" id="title" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea id="description" class="form-control" rows="3"></textarea>
            </div>
            <div class="row">
              <div class="col-md-3 mb-3">
                <label class="form-label">Main Category *</label>
                <select id="mainCategory" class="form-select" required onchange="updateSubcategories()"></select>
              </div>
              <div class="col-md-3 mb-3">
                <label class="form-label">Subcategory</label>
                <select id="subCategory" class="form-select"></select>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Condition *</label>
                <select id="condition" class="form-select" required>
                  <option>New</option>
                  <option>Like New</option>
                  <option>Good</option>
                  <option>Used</option>
                </select>
              </div>
            </div>
            <div class="row">
              <div class="col-md-4 mb-3">
                <label class="form-label">Listing Type *</label>
                <select id="itemType" class="form-select" required onchange="togglePrice()">
                  <option value="Sale">For Sale</option>
                  <option value="Donation">Free / Donation</option>
                </select>
              </div>
              <div class="col-md-4 mb-3" id="priceField">
                <label class="form-label">Price (৳)</label>
                <input type="number" step="0.01" min="0" id="price" class="form-control">
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label">Quantity *</label>
                <input type="number" min="1" id="quantity" class="form-control" value="1" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Pickup Location *</label>
              <input type="text" id="pickupLocation" class="form-control" required>
            </div>

            <label class="form-label">Photos <span class="text-muted small">(paste up to 3 image links; the first is the cover photo)</span></label>
            <div class="mb-2"><input type="text" class="form-control" placeholder="images/items/photo1.jpg"></div>
            <div class="mb-2"><input type="text" class="form-control" placeholder="images/items/photo2.jpg (optional)"></div>
            <div class="mb-3"><input type="text" class="form-control" placeholder="images/items/photo3.jpg (optional)"></div>

            <button type="submit" class="btn btn-success">Submit for Approval</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="footer-mount"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  requireDemoLogin();

  const mainSelect = document.getElementById('mainCategory');
  mainCategories().forEach(m => {
    const opt = document.createElement('option');
    opt.value = m.id;
    opt.textContent = m.name;
    mainSelect.appendChild(opt);
  });

  function updateSubcategories() {
    const mainId = mainSelect.value;
    const subSelect = document.getElementById('subCategory');
    subSelect.innerHTML = '';
    const subs = subCategories(mainId);
    if (subs.length > 0) {
      const generalOpt = document.createElement('option');
      generalOpt.value = mainId;
      generalOpt.textContent = 'General ' + categoryName(Number(mainId));
      subSelect.appendChild(generalOpt);
      subs.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = s.name;
        subSelect.appendChild(opt);
      });
    } else {
      const opt = document.createElement('option');
      opt.value = mainId;
      opt.textContent = '(no subcategories)';
      subSelect.appendChild(opt);
    }
  }
  updateSubcategories();

  function togglePrice() {
    const type = document.getElementById('itemType').value;
    document.getElementById('priceField').style.display = type === 'Donation' ? 'none' : 'block';
  }
  togglePrice();

  document.getElementById('listingForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const title = document.getElementById('title').value.trim();
    DEMO.addMyListing({
      title,
      category: categoryName(Number(document.getElementById('subCategory').value)),
      type: document.getElementById('itemType').value,
      price: document.getElementById('price').value || 0,
      status: 'Pending',
    });
    alert('Listing submitted and pending admin approval (demo only).');
    window.location = 'my-listings.html';
  });
</script>
</body>
</html>
