<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout · Share Shelf</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-mount"></div>

<div class="container py-4">
  <h3 class="mb-4">Checkout</h3>
  <div class="row">
    <div class="col-md-7">
      <div class="card shadow-sm p-4">
        <form id="checkoutForm">
          <div class="mb-3">
            <label class="form-label">Payment Method</label>
            <select class="form-select" required>
              <option>bKash</option>
              <option>Nagad</option>
              <option>Bank Transfer</option>
              <option>Card</option>
              <option>COD</option>
            </select>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Pickup Date</label>
              <input type="date" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Pickup Time</label>
              <input type="time" step="60" class="form-control" required>
            </div>
          </div>
          <button class="btn btn-success w-100" type="submit">Confirm Purchase</button>
        </form>
      </div>
    </div>
    <div class="col-md-5">
      <div class="card shadow-sm p-4">
        <h6>Order Summary</h6>
        <div id="orderSummary"></div>
        <hr>
        <div class="d-flex justify-content-between fw-bold">
          <span>Total</span><span id="orderTotal"></span>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="footer-mount"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  requireDemoLogin();

  const cart = DEMO.getCart();
  if (cart.length === 0) window.location = 'cart.html';

  let total = 0;
  let html = '';
  cart.forEach(c => {
    const item = findItem(c.id);
    if (!item) return;
    total += item.price * c.qty;
    html += `<div class="d-flex justify-content-between small"><span>${item.title} × ${c.qty}</span><span>${moneyBDT(item.price * c.qty)}</span></div>`;
  });
  document.getElementById('orderSummary').innerHTML = html;
  document.getElementById('orderTotal').textContent = moneyBDT(total);

  document.getElementById('checkoutForm').addEventListener('submit', function(e) {
    e.preventDefault();
    DEMO.clearCart();
    alert('Purchase confirmed! (demo only) You can rate your seller from My Purchases.');
    window.location = 'my-purchases.html';
  });
</script>
</body>
</html>
