<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · Share Shelf</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-mount"></div>

<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h3 class="mb-3">Login</h3>
          <div class="alert alert-info small">Demo only — any name/email works, there's no real password check.</div>
          <div id="errorBox" class="alert alert-danger py-2 d-none"></div>
          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label">Your Name</label>
              <input type="text" id="nameField" class="form-control" required placeholder="e.g. Rafi Ahmed">
            </div>
            <div class="mb-3">
              <label class="form-label">Email or Phone</label>
              <input type="text" id="idField" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <div class="input-group">
                <input type="password" id="pwField" class="form-control" required>
                <button class="btn btn-outline-secondary" type="button" onclick="togglePw()">👁</button>
              </div>
            </div>
            <button type="submit" class="btn btn-success w-100">Login</button>
          </form>
          <p class="text-center mt-3 mb-0">New here? <a href="register.html">Create an account</a></p>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="footer-mount"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
function togglePw() {
  const f = document.getElementById('pwField');
  f.type = f.type === 'password' ? 'text' : 'password';
}

document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const name = document.getElementById('nameField').value.trim();
  if (!name) return;
  DEMO.setAdmin(false);
  DEMO.setUser({ name });
  window.location = 'index.html';
});
</script>
</body>
</html>
