<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports · Share Shelf Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-mount"></div>

<div class="container py-4">
  <a href="admin.html" class="btn btn-sm btn-outline-secondary mb-3">&larr; Dashboard</a>
  <h3 class="mb-3">Reports</h3>

  <div class="table-responsive">
  <table class="table bg-white shadow-sm align-middle">
    <thead><tr><th>Item</th><th>Reported By</th><th>Reason</th><th>Description</th><th>Status</th><th></th></tr></thead>
    <tbody id="reportsBody">
      <tr data-id="r1">
        <td>Vintage Wall Clock</td>
        <td>Tania Khan</td>
        <td>Misleading Description</td>
        <td class="small">Item photos don't match what was actually listed.</td>
        <td><span class="badge bg-warning">Pending</span></td>
        <td>
          <button class="btn btn-sm btn-success" onclick="resolve(this)">Mark Resolved</button>
          <button class="btn btn-sm btn-danger" onclick="removeListing(this)">Remove Listing</button>
        </td>
      </tr>
      <tr data-id="r2">
        <td>Used Treadmill</td>
        <td>Rakib Hossain</td>
        <td>Seller Unresponsive</td>
        <td class="small">Messaged twice about pickup, no reply in 4 days.</td>
        <td><span class="badge bg-warning">Pending</span></td>
        <td>
          <button class="btn btn-sm btn-success" onclick="resolve(this)">Mark Resolved</button>
          <button class="btn btn-sm btn-danger" onclick="removeListing(this)">Remove Listing</button>
        </td>
      </tr>
    </tbody>
  </table>
  </div>
</div>

<div id="footer-mount"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  requireDemoAdmin();

  function resolve(btn) {
    const row = btn.closest('tr');
    row.querySelector('td:nth-child(5)').innerHTML = '<span class="badge bg-success">Resolved</span>';
    row.querySelectorAll('button').forEach(b => b.disabled = true);
  }

  function removeListing(btn) {
    if (!confirm('Remove the reported listing?')) return;
    const row = btn.closest('tr');
    row.style.opacity = '0.5';
    row.querySelectorAll('td')[0].innerHTML += ' <span class="badge bg-secondary">Listing removed</span>';
  }
</script>
</body>
</html>
