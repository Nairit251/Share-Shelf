<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse · Share Shelf</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-mount"></div>

<div class="container py-4">
  <div class="row">
    <div class="col-md-3 mb-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h6>Filter</h6>
          <label class="form-label small mt-2">Category</label>
          <select id="categorySelect" class="form-select form-select-sm mb-2"></select>
          <label class="form-label small">Type</label>
          <select id="typeSelect" class="form-select form-select-sm mb-2">
            <option value="">All</option>
            <option value="Sale">For Sale</option>
            <option value="Donation">Free / Donation</option>
          </select>
        </div>
      </div>
    </div>

    <div class="col-md-9">
      <h4 class="mb-3" id="resultsHeading">All Items</h4>
      <div class="row g-4" id="itemGrid"></div>
    </div>
  </div>
</div>

<div id="footer-mount"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const initialQ = params.get('q') || '';
  const initialCategory = params.get('category') || '';

  // Build category dropdown with optgroups
  const catSelect = document.getElementById('categorySelect');
  catSelect.innerHTML = '<option value="">All Categories</option>';
  mainCategories().forEach(m => {
    const subs = subCategories(m.id);
    const group = document.createElement('optgroup');
    group.label = m.name;
    const allOpt = document.createElement('option');
    allOpt.value = m.id;
    allOpt.textContent = 'All ' + m.name;
    if (String(m.id) === initialCategory) allOpt.selected = true;
    group.appendChild(allOpt);
    subs.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.id;
      opt.textContent = s.name;
      if (String(s.id) === initialCategory) opt.selected = true;
      group.appendChild(opt);
    });
    catSelect.appendChild(group);
  });

  function renderResults() {
    const q = initialQ.toLowerCase();
    const category = catSelect.value;
    const type = document.getElementById('typeSelect').value;

    let results = category ? itemsInCategory(category) : ITEMS;
    if (type) results = results.filter(i => i.type === type);
    if (q) {
      // whole-word match, same fix as the PHP version
      results = results.filter(i => {
        const t = (' ' + i.title + ' ').toLowerCase();
        const d = (' ' + i.desc + ' ').toLowerCase();
        return t.includes(' ' + q + ' ') || d.includes(' ' + q + ' ');
      });
    }

    document.getElementById('resultsHeading').textContent = q ? `Results for "${q}"` : 'All Items';

    const grid = document.getElementById('itemGrid');
    grid.innerHTML = '';
    if (results.length === 0) {
      grid.innerHTML = '<p class="text-muted">No items found.</p>';
      return;
    }
    results.forEach(item => {
      grid.innerHTML += `
        <div class="col-6 col-md-4">
          <div class="card card-item h-100 shadow-sm">
            <img src="https://via.placeholder.com/300x180?text=${encodeURIComponent(item.title)}" class="card-img-top" alt="">
            <div class="card-body d-flex flex-column">
              <div class="card-title text-truncate">${item.title}</div>
              <div class="small text-muted mb-1">${categoryName(item.category)} · ${item.condition}</div>
              <div class="mb-2">
                ${item.type === 'Donation' ? '<span class="badge badge-free">Free</span>' : `<span class="fw-bold">${moneyBDT(item.price)}</span>`}
              </div>
              <a href="item.html?id=${item.id}" class="btn btn-sm btn-outline-success mt-auto">View Details</a>
            </div>
          </div>
        </div>`;
    });
  }

  catSelect.addEventListener('change', renderResults);
  document.getElementById('typeSelect').addEventListener('change', renderResults);
  renderResults();
</script>
</body>
</html>
