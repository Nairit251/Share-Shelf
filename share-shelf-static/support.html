<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support · Share Shelf</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-mount"></div>

<div class="container py-4">
  <div class="row">
    <div class="col-md-5 mb-4">
      <div class="card shadow-sm p-4">
        <h4>Contact Support</h4>
        <form id="supportForm">
          <div class="mb-3">
            <label class="form-label">Subject</label>
            <input type="text" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea class="form-control" rows="4" required></textarea>
          </div>
          <button class="btn btn-success" type="submit">Submit Ticket</button>
        </form>
      </div>
    </div>
    <div class="col-md-7">
      <h5>My Tickets</h5>
      <div class="card shadow-sm mb-3">
        <div class="card-body">
          <div class="d-flex justify-content-between">
            <strong>Payment not going through</strong>
            <span class="badge bg-success">Resolved</span>
          </div>
          <p class="mb-1 mt-2">bKash payment failed twice during checkout.</p>
          <div class="alert alert-light border mt-2 mb-0 small">
            <strong>Support reply:</strong> Fixed — please try again, let us know if it persists.
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="footer-mount"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  requireDemoLogin();
  document.getElementById('supportForm').addEventListener('submit', function(e) {
    e.preventDefault();
    alert('Ticket submitted (demo only).');
    this.reset();
  });
</script>
</body>
</html>
