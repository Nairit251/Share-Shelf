<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login · Share Shelf</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-mount"></div>

<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm border-dark">
        <div class="card-body p-4">
          <h3 class="mb-3">🔒 Admin Login</h3>
          <div class="alert alert-info small">Demo only — any credentials work here.</div>
          <form id="adminForm">
            <div class="mb-3">
              <label class="form-label">Email or Phone</label>
              <input type="text" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <div class="input-group">
                <input type="password" id="pwField" class="form-control" required>
                <button class="btn btn-outline-secondary" type="button" onclick="togglePw()">👁</button>
              </div>
            </div>
            <button type="submit" class="btn btn-dark w-100">Login as Admin</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="footer-mount"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
function togglePw() {
  const f = document.getElementById('pwField');
  f.type = f.type === 'password' ? 'text' : 'password';
}
document.getElementById('adminForm').addEventListener('submit', function(e) {
  e.preventDefault();
  DEMO.clearUser();
  DEMO.setAdmin(true);
  window.location = 'admin.html';
});
</script>
</body>
</html>
