<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register · Share Shelf</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-mount"></div>

<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h3 class="mb-3">Create an Account</h3>
          <div class="alert alert-info small">Demo only — this doesn't create a real account, just a local browser session.</div>
          <form id="regForm">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">First Name *</label>
                <input type="text" id="firstName" class="form-control" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Last Name</label>
                <input type="text" id="lastName" class="form-control">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">Phone *</label>
              <input type="text" class="form-control" required pattern="01[0-9]{9}" maxlength="11" minlength="11" title="11-digit phone number starting with 01">
              <div class="form-text">11 digits, e.g. 01XXXXXXXXX</div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Password *</label>
                <div class="input-group">
                  <input type="password" id="pw1" class="form-control" required>
                  <button class="btn btn-outline-secondary" type="button" onclick="togglePw('pw1')">👁</button>
                </div>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Confirm Password *</label>
                <div class="input-group">
                  <input type="password" id="pw2" class="form-control" required>
                  <button class="btn btn-outline-secondary" type="button" onclick="togglePw('pw2')">👁</button>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-md-4 mb-3">
                <label class="form-label">District *</label>
                <input type="text" class="form-control" required>
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label">Area *</label>
                <input type="text" class="form-control" required>
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label">Street *</label>
                <input type="text" class="form-control" required>
              </div>
            </div>
            <button type="submit" class="btn btn-success w-100">Register</button>
          </form>
          <p class="text-center mt-3 mb-0">Already have an account? <a href="login.html">Login</a></p>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="footer-mount"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
function togglePw(id) {
  const f = document.getElementById(id);
  f.type = f.type === 'password' ? 'text' : 'password';
}

document.getElementById('regForm').addEventListener('submit', function(e) {
  e.preventDefault();
  if (document.getElementById('pw1').value !== document.getElementById('pw2').value) {
    alert("Passwords don't match.");
    return;
  }
  const first = document.getElementById('firstName').value.trim();
  const last = document.getElementById('lastName').value.trim();
  DEMO.setAdmin(false);
  DEMO.setUser({ name: (first + ' ' + last).trim() || 'New User' });
  window.location = 'index.html';
});
</script>
</body>
</html>
