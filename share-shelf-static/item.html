<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Item Details · Share Shelf</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-mount"></div>

<div class="container py-4" id="itemContainer">
  <!-- filled by JS -->
</div>

<div id="footer-mount"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const item = findItem(params.get('id'));
  const container = document.getElementById('itemContainer');

  if (!item) {
    container.innerHTML = '<div class="alert alert-danger">Item not found. <a href="browse.html">Back to Browse</a></div>';
  } else {
    document.title = item.title + ' · Share Shelf';
    const user = DEMO.getUser();

    let actionHtml = '';
    if (!user) {
      actionHtml = '<a href="login.html" class="btn btn-success">Login to Buy / Claim</a>';
    } else if (item.type === 'Donation') {
      actionHtml = `
        <button class="btn btn-success" onclick="claimItem()">Claim Item</button>
        <a href="#" class="btn btn-outline-danger" onclick="alert('Report submitted (demo only).'); return false;">🚩 Report</a>`;
    } else {
      actionHtml = `
        <button class="btn btn-success" onclick="addToCartDemo()">Add to Cart</button>
        <a href="#" class="btn btn-outline-danger" onclick="alert('Report submitted (demo only).'); return false;">🚩 Report</a>`;
    }

    container.innerHTML = `
      <div class="row g-4">
        <div class="col-md-6">
          <img src="https://via.placeholder.com/600x380?text=${encodeURIComponent(item.title)}"
               class="d-block w-100 shadow-sm rounded" style="height:380px;object-fit:cover;background:#e9ecef;" alt="">
        </div>
        <div class="col-md-6">
          <h3>${item.title}</h3>
          <p class="text-muted mb-1">${categoryName(item.category)} · Condition: ${item.condition}</p>
          <h4 class="mb-3">
            ${item.type === 'Donation' ? '<span class="badge badge-free fs-6">Free / Donation</span>' : moneyBDT(item.price)}
          </h4>
          <p>${item.desc}</p>
          <ul class="list-unstyled small text-muted">
            <li>📍 Pickup: ${item.pickup}</li>
            <li>📦 Quantity available: ${item.qty}</li>
            <li>👤 Seller: ${item.seller} — ⭐ ${item.rating}</li>
          </ul>
          ${actionHtml}
        </div>
      </div>`;
  }

  function addToCartDemo() {
    DEMO.addToCart(item.id);
    alert('Added to cart!');
    renderNavbar();
  }

  function claimItem() {
    if (!confirm('Claim this free item? (demo only, nothing is really removed)')) return;
    alert('You claimed this item! Check My Claims.');
  }
</script>
</body>
</html>
