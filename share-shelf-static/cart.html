<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Cart · Share Shelf</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-mount"></div>

<div class="container py-4">
  <h3 class="mb-4">My Cart</h3>
  <div id="cartContent"></div>
</div>

<div id="footer-mount"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  requireDemoLogin();

  function render() {
    const cart = DEMO.getCart();
    const container = document.getElementById('cartContent');

    if (cart.length === 0) {
      container.innerHTML = '<p class="text-muted">Your cart is empty. <a href="browse.html">Browse items</a>.</p>';
      return;
    }

    let total = 0;
    let rows = '';
    cart.forEach(c => {
      const item = findItem(c.id);
      if (!item) return;
      const subtotal = item.price * c.qty;
      total += subtotal;
      rows += `
        <tr>
          <td>${item.title}</td>
          <td>${moneyBDT(item.price)}</td>
          <td>${c.qty}</td>
          <td>${moneyBDT(subtotal)}</td>
          <td><button class="btn btn-sm btn-outline-danger" onclick="removeItem(${c.id})">Remove</button></td>
        </tr>`;
    });

    container.innerHTML = `
      <div class="table-responsive">
      <table class="table align-middle bg-white shadow-sm">
        <thead><tr><th>Item</th><th>Unit Price</th><th>Qty</th><th>Subtotal</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      </div>
      <div class="d-flex justify-content-end">
        <div class="card p-3 shadow-sm" style="min-width:280px;">
          <div class="d-flex justify-content-between mb-2"><span>Total:</span><strong>${moneyBDT(total)}</strong></div>
          <a href="checkout.html" class="btn btn-success">Proceed to Checkout</a>
        </div>
      </div>`;
  }

  function removeItem(id) {
    DEMO.removeFromCart(id);
    renderNavbar();
    render();
  }

  render();
</script>
</body>
</html>
