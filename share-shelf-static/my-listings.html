<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Listings · Share Shelf</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-mount"></div>

<div class="container py-4">
  <h3 class="mb-4">My Listings</h3>
  <div class="table-responsive">
  <table class="table table-hover align-middle bg-white shadow-sm">
    <thead><tr><th>Title</th><th>Category</th><th>Type</th><th>Price</th><th>Approval</th></tr></thead>
    <tbody id="listingsBody"></tbody>
  </table>
  </div>
</div>

<div id="footer-mount"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  requireDemoLogin();

  const body = document.getElementById('listingsBody');
  const listings = DEMO.getMyListings();

  if (listings.length === 0) {
    body.innerHTML = `<tr><td colspan="5" class="text-muted text-center py-4">You haven't listed anything yet. <a href="add-item.html">List your first item</a>.</td></tr>`;
  } else {
    listings.forEach(l => {
      const badgeClass = l.status === 'Approved' ? 'success' : (l.status === 'Rejected' ? 'danger' : 'warning');
      body.innerHTML += `
        <tr>
          <td>${l.title}</td>
          <td>${l.category}</td>
          <td>${l.type}</td>
          <td>${l.type === 'Donation' ? 'Free' : moneyBDT(l.price)}</td>
          <td><span class="badge bg-${badgeClass}">${l.status}</span></td>
        </tr>`;
    });
  }
</script>
</body>
</html>
