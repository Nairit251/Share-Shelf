<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Share Shelf</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-mount"></div>

<div class="container py-4">

  <div class="p-5 mb-4 rounded-3" style="background: linear-gradient(135deg,#2f6f4f,#4c9a6a); color:#fff;">
    <h1 class="display-6 fw-bold">Give things a second life.</h1>
    <p class="lead mb-4">Buy, sell, or donate second-hand items in your community — Share Shelf connects neighbors with what they no longer need.</p>
    <a href="browse.html" class="btn btn-light btn-lg me-2">Browse Items</a>
    <a href="register.html" class="btn btn-outline-light btn-lg">Join Now</a>
  </div>

  <h4 class="mb-3">Browse by Category</h4>
  <div class="d-flex flex-wrap gap-2 mb-5" id="categoryChips"></div>

  <h4 class="mb-3">Recently Listed</h4>
  <div class="row g-4" id="itemGrid"></div>

</div>

<div id="footer-mount"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  const chipsEl = document.getElementById('categoryChips');
  mainCategories().forEach(c => {
    const a = document.createElement('a');
    a.href = 'browse.html?category=' + c.id;
    a.className = 'btn btn-outline-secondary btn-sm';
    a.textContent = c.name;
    chipsEl.appendChild(a);
  });

  const gridEl = document.getElementById('itemGrid');
  ITEMS.slice(0, 6).forEach(item => {
    gridEl.innerHTML += `
      <div class="col-6 col-md-4 col-lg-2">
        <div class="card card-item h-100 shadow-sm">
          <img src="https://via.placeholder.com/300x180?text=${encodeURIComponent(item.title)}" class="card-img-top" alt="">
          <div class="card-body d-flex flex-column">
            <div class="card-title text-truncate">${item.title}</div>
            <div class="small text-muted mb-2">${categoryName(item.category)}</div>
            <div class="mt-auto">
              ${item.type === 'Donation' ? '<span class="badge badge-free">Free</span>' : `<span class="fw-bold">${moneyBDT(item.price)}</span>`}
            </div>
            <a href="item.html?id=${item.id}" class="btn btn-sm btn-outline-success mt-2">View</a>
          </div>
        </div>
      </div>`;
  });
</script>
</body>
</html>
